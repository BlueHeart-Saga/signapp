# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Production CI/CD (PROD - Frontend & Backend)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/main_esigniva.yml"
  workflow_dispatch:

concurrency:
  group: prod-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================
  # 0. Path Filter Job (Detects what changed in this push)
  # =============================================================
  changes:
    if: github.repository == 'Devopstrio/SafeSign_Platform'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/main_esigniva.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/main_esigniva.yml'

  # =============================================================
  # 1. Build & Deploy Frontend (React -> Azure Web App esigniva)
  # =============================================================
  deploy-frontend:
    needs: changes
    if: github.repository == 'Devopstrio/SafeSign_Platform' && (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create .env file for PROD
        run: |
          echo "REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}" > .env
          echo "REACT_APP_GOOGLE_API_KEY=${{ secrets.REACT_APP_GOOGLE_API_KEY }}" >> .env
          echo "REACT_APP_GOOGLE_REDIRECT_URI=${{ secrets.REACT_APP_GOOGLE_REDIRECT_URI }}" >> .env
          echo "REACT_APP_DROPBOX_APP_KEY=${{ secrets.REACT_APP_DROPBOX_APP_KEY }}" >> .env
          echo "REACT_APP_ONEDRIVE_CLIENT_ID=${{ secrets.REACT_APP_ONEDRIVE_CLIENT_ID }}" >> .env
          echo "REACT_APP_BOX_CLIENT_ID=${{ secrets.REACT_APP_BOX_CLIENT_ID }}" >> .env
          echo "REACT_APP_BOX_REDIRECT_URI=${{ secrets.REACT_APP_BOX_REDIRECT_URI }}" >> .env
          echo "REACT_APP_STRIPE_PUBLISHABLE_KEY=${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}" >> .env
          echo "REACT_APP_API_BASE_URL=${{ secrets.REACT_APP_API_BASE_URL }}" >> .env
          echo "GENERATE_SOURCEMAP=false" >> .env
          echo "DISABLE_ESLINT_PLUGIN=true" >> .env

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: CI=false npm run build

      - name: Deploy Frontend to Azure Web App (esigniva)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'esigniva'
          publish-profile: ${{ secrets.AZURE_ESIGNIVA_WEBAPP_PUBLISH_PROFILE }}
          package: frontend/build

  # =============================================================
  # 2. Build & Deploy Backend (FastAPI Docker -> Azure signapp-backend-docker)
  # =============================================================
  deploy-backend:
    needs: changes
    if: github.repository == 'Devopstrio/SafeSign_Platform' && (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            blueheartsaga/signapp-backend:${{ github.sha }}
            blueheartsaga/signapp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Backend to Azure Web App (signapp-backend-docker)
        uses: azure/webapps-deploy@v3
        with:
          app-name: signapp-backend-docker
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: blueheartsaga/signapp-backend:${{ github.sha }}